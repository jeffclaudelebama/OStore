<!DOCTYPE html>
<html lang="fr">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="icon" href="img/logo.png" type="image/png">
      <title>Ostore - Finaliser la commande</title>
      <link rel="stylesheet" href="vender/bootstrap/css/bootstrap.min.css">
      <link rel="stylesheet" href="vender/icofont/icofont.min.css">
      <link rel="stylesheet" href="vender/sidebar/demo.css">
      <link rel="stylesheet" href="css/style.css">
   </head>
   <body class="bg-light">
      <div class="d-flex flex-column vh-100">
         <div class="bg-primary p-3 d-flex align-items-center gap-3">
            <a href="cart.html" class="text-white"><i class="bi bi-arrow-left fs-5"></i></a>
            <div>
               <h6 class="fw-bold text-white mb-0" data-i18n="checkout.title">Finaliser la commande</h6>
               <p class="text-white-50 small m-0">Total : <span data-checkout-total>0 FCFA</span></p>
            </div>
         </div>
         <div class="my-auto overflow-auto vh-100 p-3">
            <form id="checkout-form">
               <div class="bg-white rounded-3 shadow-sm p-3 mb-3">
                  <h6 class="fw-bold text-black mb-3" data-i18n="checkout.delivery">Livraison</h6>
                  <input name="name" required type="text" class="form-control rounded-3 py-2 mb-3" placeholder="Nom & Prénom" aria-label="Nom & Prénom" data-i18n-placeholder="checkout.fullName">
                  <input name="phone" required type="tel" class="form-control rounded-3 py-2 mb-3" placeholder="Numéro de téléphone / WhatsApp (+241 ...)" aria-label="Numéro de téléphone / WhatsApp" data-i18n-placeholder="checkout.phone">
                  <select name="city" required class="form-select rounded-3 py-2 mb-3" aria-label="Ville"><option value="">Ville</option><option>Libreville</option><option>Akanda</option><option>Owendo</option></select>
                  <input name="address" required type="text" class="form-control rounded-3 py-2 mb-3" placeholder="Quartier précis / Repère" aria-label="Quartier précis / Repère" data-i18n-placeholder="checkout.location">
                  <textarea name="instructions" class="form-control rounded-3 py-2" rows="3" placeholder="Instructions de livraison (optionnel)" aria-label="Instructions de livraison" data-i18n-placeholder="checkout.instructions"></textarea>
               </div>
               <div class="bg-white rounded-3 shadow-sm p-3 mb-3">
                  <h6 class="fw-bold text-black mb-3" data-i18n="checkout.payment">Mode de paiement</h6>
                  <div class="form-check border-bottom pb-3 mb-3">
                     <input class="form-check-input" type="radio" name="payment" id="mobile-money" checked>
                     <label class="form-check-label" for="mobile-money" data-i18n="checkout.mobileMoney">Airtel Money / Moov Money</label>
                  </div>
                  <div class="form-check">
                     <input class="form-check-input" type="radio" name="payment" id="cash">
                     <label class="form-check-label" for="cash" data-i18n="checkout.cash">Paiement à la livraison (Cash / Espèces)</label>
                  </div>
               </div>
               <div class="bg-white rounded-3 shadow-sm p-3 mb-3">
                  <h6 class="fw-bold text-black mb-3">Récapitulatif</h6>
                  <div id="checkout-summary"></div>
                  <div class="d-flex justify-content-between border-top pt-2 mt-2 fw-bold">
                     <span>Total</span>
                     <span data-checkout-total>0 FCFA</span>
                  </div>
               </div>
            </form>
         </div>
         <div class="bg-white p-3 shadow-sm border-top">
            <button type="submit" form="checkout-form" class="btn btn-success w-100 text-uppercase btn-lg fw-bold" data-i18n="actions.confirm">Confirmer la commande</button>
         </div>
      </div>
      <script src="vender/bootstrap/js/bootstrap.bundle.min.js"></script>
      <script src="vender/jquery/jquery.min.js"></script>
      <script src="vender/sidebar/hc-offcanvas-nav.js"></script>
      <script src="js/custom.js"></script>
      <script src="js/cart.js"></script>
      <script src="assets/js/i18n.js"></script>
      <script>
         document.addEventListener('DOMContentLoaded', function () {
            var form = document.getElementById('checkout-form');
            var totals = document.querySelectorAll('[data-checkout-total]');
            var summary = document.getElementById('checkout-summary');
            var items = JSON.parse(localStorage.getItem('ostore_cart') || '[]');
            if (window.getCartTotal) {
               totals.forEach(function (total) {
                  total.textContent = new Intl.NumberFormat('fr-FR').format(window.getCartTotal()) + ' FCFA';
               });
            }
            if (summary) {
               summary.innerHTML = items.length ? items.map(function (item) {
                  return '<div class="d-flex justify-content-between small mb-2"><span>' + item.name + ' × ' + item.quantity + '</span><span>' + new Intl.NumberFormat('fr-FR').format(item.price * item.quantity) + ' FCFA</span></div>';
               }).join('') : '<p class="text-muted mb-0">Votre panier est vide.</p>';
            }
            if (form) {
               form.addEventListener('submit', function (event) {
                  event.preventDefault();
                  var data = new FormData(form);
                  var order = {
                     id: 'OST-' + Date.now(),
                     customer: Object.fromEntries(data.entries()),
                     items: JSON.parse(localStorage.getItem('ostore_cart') || '[]'),
                     total: window.getCartTotal ? window.getCartTotal() : 0,
                     createdAt: new Date().toISOString()
                  };
                  localStorage.setItem('ostore_last_order', JSON.stringify(order));
                  localStorage.removeItem('ostore_cart');
                  window.location.href = 'order-received.html';
               });
            }
         });
      </script>
   </body>
</html>
