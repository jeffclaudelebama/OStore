<!DOCTYPE html>
<html lang="fr">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>Ostore - Connexion</title>
   <link rel="stylesheet" href="vender/bootstrap/css/bootstrap.min.css">
   <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
   <main class="container py-5" style="max-width: 480px;">
      <div class="bg-white rounded-3 shadow-sm p-4">
         <h1 class="h4 fw-bold mb-1">Bon retour sur Ostore</h1>
         <p class="text-muted mb-4">Connectez-vous pour suivre vos commandes.</p>
         <form id="signin-form">
            <label class="form-label" for="signin-email">E-mail</label>
            <input id="signin-email" name="email" type="email" class="form-control mb-3" required autocomplete="email">
            <label class="form-label" for="signin-password">Mot de passe</label>
            <input id="signin-password" name="password" type="password" class="form-control mb-3" required autocomplete="current-password">
            <button class="btn btn-dark w-100" type="submit">Se connecter</button>
            <p data-auth-message hidden></p>
         </form>
         <p class="text-center mt-4 mb-0">Nouveau client ? <a href="signup.html">Créer un compte</a></p>
      </div>
   </main>
   <script src="js/auth.js"></script>
</body>
</html>
